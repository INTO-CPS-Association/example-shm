[tool.poetry]
name = "example-shm"
version = "0.5.0"
description = "Demonstration for structural health monitoring of engineering structures"
authors = [
    "Mohamed Abdulkarim <202206332@post.au.dk>",
    "Jakob Vium Medom <jvm@mpe.au.dk>",
    "Prasad Talasila <prasadtalasila@gmail.com>"
]
readme = "README.md"
license = "INTO-CPS Association"
packages = [{include = "*", from="src"}]

[tool.poetry.dependencies]
python = ">=3.8, <3.13"
paho-mqtt = "^2.1.0"
numpy = "^1.24.0"
click ="^8.1.8"
pyOMA-2 = "1.0.0"
yafem = "1.0.0"

[tool.poetry.group.dev.dependencies]
pylint = "^3.0.0"
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
pytest-mock = "^3.10.0"
pytest-env = "^0.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
example-shm = "examples.example:cli"